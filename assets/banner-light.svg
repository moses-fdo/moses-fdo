<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="auto">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff">
        <animate attributeName="stop-color" values="#ffffff;#f6f8fa;#ffffff" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#f6f8fa">
        <animate attributeName="stop-color" values="#f6f8fa;#ffffff;#f6f8fa" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#ffffff">
        <animate attributeName="stop-color" values="#ffffff;#f6f8fa;#ffffff" dur="12s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0969da">
        <animate attributeName="stop-color" values="#0969da;#1f883d;#0969da" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#1f883d">
        <animate attributeName="stop-color" values="#1f883d;#0969da;#1f883d" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="accent2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9a73b5">
        <animate attributeName="stop-color" values="#9a73b5;#0969da;#9a73b5" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0969da">
        <animate attributeName="stop-color" values="#0969da;#9a73b5;#0969da" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1f2328" opacity="0.04"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="900" height="320" fill="url(#bgGrad)"/>
  <rect width="900" height="320" fill="url(#dots)"/>

  <!-- Animated grid lines -->
  <g opacity="0.04" stroke="#1f2328" stroke-width="0.5">
    <line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="160" x2="900" y2="160"/>
    <line x1="0" y1="240" x2="900" y2="240"/>
    <line x1="180" y1="0" x2="180" y2="320"/>
    <line x1="360" y1="0" x2="360" y2="320"/>
    <line x1="540" y1="0" x2="540" y2="320"/>
    <line x1="720" y1="0" x2="720" y2="320"/>
  </g>

  <!-- Floating hexagon 1 -->
  <g transform="translate(80, 70)">
    <animateTransform attributeName="transform" type="translate" values="80,70;85,65;80,70" dur="6s" repeatCount="indefinite"/>
    <polygon points="0,-20 17.3,-10 17.3,10 0,20 -17.3,10 -17.3,-10" fill="none" stroke="url(#accent)" stroke-width="1" opacity="0.25">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <!-- Floating hexagon 2 -->
  <g transform="translate(820, 250)">
    <animateTransform attributeName="transform" type="translate" values="820,250;815,245;820,250" dur="7s" repeatCount="indefinite"/>
    <polygon points="0,-14 12.1,-7 12.1,7 0,14 -12.1,7 -12.1,-7" fill="none" stroke="url(#accent2)" stroke-width="1" opacity="0.2">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="25s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <!-- Floating square -->
  <g transform="translate(160, 260)">
    <animateTransform attributeName="transform" type="translate" values="160,260;163,255;160,260" dur="5s" repeatCount="indefinite"/>
    <rect x="-12" y="-12" width="24" height="24" fill="none" stroke="#0969da" stroke-width="1" opacity="0.15">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Floating diamond -->
  <g transform="translate(750, 80)">
    <animateTransform attributeName="transform" type="translate" values="750,80;748,75;750,80" dur="8s" repeatCount="indefinite"/>
    <rect x="-10" y="-10" width="20" height="20" fill="none" stroke="#1f883d" stroke-width="1" opacity="0.15" transform="rotate(45)">
      <animateTransform attributeName="transform" type="rotate" from="45" to="405" dur="22s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Code angle brackets left side -->
  <g opacity="0.06" fill="#1f2328">
    <text x="60" y="190" font-family="monospace" font-size="60" font-weight="bold">&lt;/&gt;</text>
  </g>

  <!-- Code brace right side -->
  <g opacity="0.04" fill="#1f2328">
    <text x="770" y="120" font-family="monospace" font-size="50" font-weight="bold">{ }</text>
  </g>

  <!-- Orbiting particles -->
  <g opacity="0.5">
    <circle cx="450" cy="160" r="1.5" fill="#0969da">
      <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="450;400;450" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="160;120;160" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g opacity="0.5">
    <circle cx="450" cy="160" r="1.5" fill="#1f883d">
      <animate attributeName="opacity" values="0;1;0" dur="3.5s" repeatCount="indefinite" begin="1s"/>
      <animate attributeName="cx" values="450;500;450" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="160;200;160" dur="9s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g opacity="0.5">
    <circle cx="450" cy="160" r="1" fill="#9a73b5">
      <animate attributeName="opacity" values="0;1;0" dur="2.5s" repeatCount="indefinite" begin="0.5s"/>
      <animate attributeName="cx" values="450;420;450" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="160;180;160" dur="7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Accent left line -->
  <rect x="0" y="0" width="4" height="320" fill="url(#accent)"/>

  <!-- Accent bottom line -->
  <rect x="0" y="316" width="900" height="4" fill="url(#accent)" opacity="0.3"/>

  <!-- Main content -->
  <g transform="translate(60, 0)">
    <!-- Terminal prompt decoration -->
    <text x="0" y="115" font-family="monospace" font-size="16" fill="#656d76" opacity="0.6">$</text>
    <text x="18" y="115" font-family="monospace" font-size="16" fill="#0969da">
      <animate attributeName="opacity" values="1;1;0;1" dur="4s" repeatCount="indefinite"/>
      cat welcome.txt
    </text>

    <!-- Name -->
    <text x="0" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#1f2328" letter-spacing="-1">Moses Fernando</text>

    <!-- Subtitle -->
    <text x="0" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#656d76" font-weight="400" letter-spacing="0.3">Software Developer · Problem Solver · Lifelong Learner</text>

    <!-- Decorative cursor -->
    <rect x="380" y="200" width="12" height="1.5" fill="#0969da">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>

    <!-- Decorative code line -->
    <g transform="translate(0, 240)">
      <text font-family="monospace" font-size="13" fill="#656d76" opacity="0.35">
        <tspan fill="#0969da" opacity="0.4">const</tspan>
        <tspan fill="#1f2328" opacity="0.3"> developer = </tspan>
        <tspan fill="#1f883d" opacity="0.4">new</tspan>
        <tspan fill="#9a73b5" opacity="0.4"> Developer()</tspan>
      </text>
    </g>
  </g>
</svg>
