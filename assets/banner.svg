<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="100%" height="auto">
  <defs>
    <!-- Premium Charcoal Black Styling -->
    <style>
      :root {
        --bg-color: #0f0f11;
        --grid-color: rgba(255, 255, 255, 0.03);
        --accent-glow: #ffffff;
        --accent-muted: #8e8e93;
        --text-main: #f2f2f7;
        --text-muted: #636366;
        --panel-bg: rgba(22, 22, 26, 0.85);
        --panel-border: rgba(255, 255, 255, 0.08);
      }

      .bg { fill: var(--bg-color); }
      .text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Fira Code", monospace; }
      .text-mono { font-family: "Fira Code", "Courier New", Courier, monospace; }
      
      /* Grid movement keyframe */
      @keyframes gridMove {
        0% { transform: translateY(0); }
        100% { transform: translateY(40px); }
      }
      .grid-pattern {
        animation: gridMove 10s linear infinite;
      }

      /* Rotating HUD */
      @keyframes rotateCW {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes rotateCCW {
        0% { transform: rotate(360deg); }
        100% { transform: rotate(0deg); }
      }
      .rot-cw {
        animation: rotateCW 25s linear infinite;
        transform-origin: 720px 145px;
        transform-box: fill-box;
      }
      .rot-ccw {
        animation: rotateCCW 20s linear infinite;
        transform-origin: 720px 145px;
        transform-box: fill-box;
      }

      /* Terminal Cursor blinking */
      @keyframes cursorBlink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .cursor {
        animation: cursorBlink 1s infinite;
      }

      /* Terminal Text typing sequence */
      @keyframes line1 { 0%, 5% { opacity: 0; } 6%, 100% { opacity: 1; } }
      @keyframes line2 { 0%, 25% { opacity: 0; } 26%, 100% { opacity: 1; } }
      @keyframes line3 { 0%, 45% { opacity: 0; } 46%, 100% { opacity: 1; } }
      @keyframes line4 { 0%, 65% { opacity: 0; } 66%, 100% { opacity: 1; } }
      @keyframes line5 { 0%, 85% { opacity: 0; } 86%, 100% { opacity: 1; } }

      .term-l1 { animation: line1 8s forwards infinite; }
      .term-l2 { animation: line2 8s forwards infinite; }
      .term-l3 { animation: line3 8s forwards infinite; }
      .term-l4 { animation: line4 8s forwards infinite; }
      .term-l5 { animation: line5 8s forwards infinite; }

      /* Floating dust particles */
      @keyframes floatParticle {
        0% { transform: translateY(0px) translateX(0px); opacity: 0.1; }
        50% { transform: translateY(-15px) translateX(8px); opacity: 0.4; }
        100% { transform: translateY(-30px) translateX(0px); opacity: 0.1; }
      }
      .particle-1 { animation: floatParticle 8s ease-in-out infinite; }
      .particle-2 { animation: floatParticle 10s ease-in-out infinite 3s; }

      .glow-silver { filter: drop-shadow(0 0 3px var(--accent-glow)); }
    </style>

    <filter id="glow-fx">
      <feGaussianBlur stdDeviation="3.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="var(--grid-color)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="900" height="280" class="bg" />

  <!-- Animated Grid Overlay -->
  <g class="grid-pattern">
    <rect width="900" height="320" y="-40" fill="url(#grid)" />
  </g>

  <!-- Ambient Light Gradient -->
  <circle cx="720" cy="140" r="140" fill="#ffffff" opacity="0.02" filter="url(#glow-fx)"/>
  <circle cx="150" cy="100" r="100" fill="#ffffff" opacity="0.015" filter="url(#glow-fx)"/>

  <!-- Left Side: Terminal Console Window (Enlarged) -->
  <g transform="translate(40, 45)">
    <!-- Terminal shadow & boarder -->
    <rect width="520" height="200" rx="8" fill="var(--panel-bg)" stroke="var(--panel-border)" stroke-width="1.5" style="backdrop-filter: blur(10px);" />
    
    <!-- Window Header -->
    <path d="M 0,8 A 8,8 0 0,1 8,0 L 512,0 A 8,8 0 0,1 520,8 L 520,30 L 0,30 Z" fill="var(--panel-border)" opacity="0.3"/>
    <circle cx="18" cy="15" r="4.5" fill="#3a3a3c" />
    <circle cx="32" cy="15" r="4.5" fill="#3a3a3c" />
    <circle cx="46" cy="15" r="4.5" fill="#3a3a3c" />
    <text x="260" y="19" class="text" font-size="10.5" fill="var(--text-muted)" text-anchor="middle">moses-fdo@minimal: ~</text>

    <!-- Terminal Content -->
    <g transform="translate(20, 52)" class="text-mono" font-size="11.5" fill="var(--text-main)">
      <!-- Line 1 -->
      <g class="term-l1">
        <text x="0" y="0" fill="var(--accent-muted)">$</text>
        <text x="15" y="0">whoami</text>
      </g>
      <!-- Line 2 -->
      <g class="term-l2">
        <text x="0" y="20" fill="var(--accent-muted)">&gt; Moses Fernando | Software Developer</text>
      </g>
      <!-- Line 3 -->
      <g class="term-l3">
        <text x="0" y="42" fill="var(--accent-muted)">$</text>
        <text x="15" y="42">cat status.json</text>
      </g>
      <!-- Line 4 -->
      <g class="term-l4">
        <text x="0" y="62" fill="var(--text-main)">
          <tspan fill="var(--text-muted)">{</tspan> focus: <tspan fill="var(--accent-glow)">"minimalism"</tspan>, theme: <tspan fill="var(--accent-glow)">"charcoal-black"</tspan> <tspan fill="var(--text-muted)">}</tspan>
        </text>
      </g>
      <!-- Line 5 -->
      <g class="term-l5">
        <text x="0" y="85" fill="var(--accent-muted)">$</text>
        <text x="15" y="85">echo "Simplicity is the ultimate sophistication."</text>
        <text x="0" y="105" fill="var(--text-muted)">// Active &amp; Ready</text>
      </g>
      <!-- Blinking Cursor -->
      <rect class="cursor" x="330" y="73" width="7" height="14" fill="var(--accent-glow)" />
    </g>

    <!-- Status Bar -->
    <path d="M 12,175 L 508,175" stroke="var(--panel-border)" stroke-width="1"/>
    <text x="20" y="188" class="text-mono" font-size="9" fill="var(--text-muted)">CHARCOAL_CORE v1.0.0</text>
    <text x="500" y="188" class="text-mono" font-size="9" fill="var(--accent-glow)" text-anchor="end">● STANDBY</text>
  </g>

  <!-- Right Side: Minimal HUD Core (Radar/Concentric Rings) -->
  <g transform="translate(720, 145)">
    <!-- Outer dash ring -->
    <circle cx="0" cy="0" r="85" fill="none" stroke="var(--panel-border)" stroke-width="1.5" stroke-dasharray="10 20 40 20"/>
    
    <!-- Rotating ring (Clockwise) -->
    <circle class="rot-cw glow-silver" cx="0" cy="0" r="70" fill="none" stroke="var(--accent-glow)" stroke-width="1.5" stroke-dasharray="60 90 20 60" opacity="0.4"/>
    
    <!-- Rotating ring (Counter-Clockwise) -->
    <circle class="rot-ccw" cx="0" cy="0" r="55" fill="none" stroke="var(--accent-muted)" stroke-width="1" stroke-dasharray="30 30 80 20" opacity="0.3"/>
    
    <!-- Inner ticks -->
    <circle cx="0" cy="0" r="40" fill="none" stroke="var(--panel-border)" stroke-width="1" stroke-dasharray="2 5"/>
    
    <!-- Solid Core -->
    <circle cx="0" cy="0" r="10" fill="var(--panel-bg)" stroke="var(--accent-glow)" stroke-width="1.5" class="glow-silver"/>
    <circle cx="0" cy="0" r="3.5" fill="var(--accent-glow)"/>
  </g>

  <!-- Floating Particles -->
  <circle cx="610" cy="120" r="2" fill="var(--accent-glow)" class="particle-1" />
  <circle cx="630" cy="200" r="1.5" fill="var(--accent-muted)" class="particle-2" />

  <!-- Outer Frame Highlights (Minimal charcoal style) -->
  <line x1="0" y1="0" x2="60" y2="0" stroke="var(--accent-muted)" stroke-width="2"/>
  <line x1="0" y1="0" x2="0" y2="60" stroke="var(--accent-muted)" stroke-width="2"/>
  
  <line x1="900" y1="280" x2="840" y2="280" stroke="var(--accent-muted)" stroke-width="2"/>
  <line x1="900" y1="280" x2="900" y2="220" stroke="var(--accent-muted)" stroke-width="2"/>
</svg>
