<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" role="img" aria-labelledby="lightTitle lightDesc">
  <title id="lightTitle">Moses Fernando — Full Stack Developer & AI Engineer</title>
  <desc id="lightDesc">Hero banner with name, title, and tech focus areas for light mode</desc>

  <defs>
    <linearGradient id="accentGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="glowL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <rect width="900" height="280" fill="#FFFFFF" rx="20"/>

  <rect x="45" y="40" width="810" height="2" fill="url(#accentGradL)" rx="1" opacity="0.4"/>

  <rect x="45" y="48" width="450" height="186" fill="url(#glowL)" rx="12"/>

  <text x="60" y="110" font-family="'Fira Code', 'SF Mono', ui-monospace, 'Cascadia Code', monospace" font-size="46" font-weight="700" fill="#111827" letter-spacing="2">
    moses-fdo
  </text>

  <text x="60" y="148" font-family="'SF Mono', ui-monospace, 'Cascadia Code', monospace" font-size="14" fill="#4F46E5" letter-spacing="5">
    FULL STACK  ·  AI ENGINEER
  </text>

  <text x="60" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" fill="#9CA3AF">
    Clean code  ·  Intelligent systems  ·  Great experiences
  </text>

  <circle cx="60" cy="212" r="4" fill="#22C55E"/>
  <text x="74" y="216" font-family="'SF Mono', ui-monospace, monospace" font-size="12" fill="#9CA3AF">AVAILABLE FOR WORK</text>

  <g transform="translate(530, 60)">
    <rect x="0" y="0" width="325" height="170" fill="#F9FAFB" rx="12" stroke="#E5E7EB" stroke-width="1"/>

    <text x="16" y="28" font-family="'SF Mono', ui-monospace, monospace" font-size="10" fill="#9CA3AF" letter-spacing="2">FOCUS AREAS</text>
    <line x1="16" y1="38" x2="309" y2="38" stroke="#E5E7EB" stroke-width="1"/>

    <rect x="16" y="52" width="141" height="30" fill="#F3F4F6" rx="6"/>
    <rect x="16" y="52" width="3" height="30" fill="#4F46E5" rx="1.5"/>
    <text x="28" y="71" font-family="'SF Mono', ui-monospace, monospace" font-size="13" fill="#374151">AI / ML · Agents</text>

    <rect x="168" y="52" width="141" height="30" fill="#F3F4F6" rx="6"/>
    <rect x="168" y="52" width="3" height="30" fill="#7C3AED" rx="1.5"/>
    <text x="180" y="71" font-family="'SF Mono', ui-monospace, monospace" font-size="13" fill="#374151">Frontend · React</text>

    <rect x="16" y="90" width="141" height="30" fill="#F3F4F6" rx="6"/>
    <rect x="16" y="90" width="3" height="30" fill="#8B5CF6" rx="1.5"/>
    <text x="28" y="109" font-family="'SF Mono', ui-monospace, monospace" font-size="13" fill="#374151">Backend · APIs</text>

    <rect x="168" y="90" width="141" height="30" fill="#F3F4F6" rx="6"/>
    <rect x="168" y="90" width="3" height="30" fill="#A78BFA" rx="1.5"/>
    <text x="180" y="109" font-family="'SF Mono', ui-monospace, monospace" font-size="13" fill="#374151">DevOps · Cloud</text>

    <rect x="16" y="128" width="293" height="30" fill="#F3F4F6" rx="6"/>
    <rect x="16" y="128" width="3" height="30" fill="#4F46E5" rx="1.5" opacity="0.4"/>
    <text x="28" y="147" font-family="'SF Mono', ui-monospace, monospace" font-size="13" fill="#6B7280">LLMs · Distributed Systems · System Design</text>
